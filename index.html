<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial, Helvetica, sans-serif;
  min-height: 100vh;
  background: #4caf50;
  overflow: hidden;
  color: #fff;
}

/* ===== HEADER ===== */
header {
  height: 56px;
  padding: 0 20px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  background: rgba(0,0,0,0.2);
}

header .right {
  display: flex;
  gap: 12px;
  align-items: center;
}

a {
  color: #fff;
  text-decoration: none;
}

/* ===== CENTER ===== */
.center {
  height: calc(100vh - 56px);
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  text-align: center;
  padding: 16px;
}

/* ===== LOGO ===== */
.logo {
  font-size: 42px;
  font-weight: 900;
  letter-spacing: 2px;
}

.sub {
  opacity: 0.9;
  margin-bottom: 28px;
}

/* ===== CARD ===== */
.card {
  background: #c62828;
  border-radius: 20px;
  padding: 18px;
  box-shadow: 0 10px 0 #8e1e1e;
  width: 100%;
  max-width: 520px;
}

.inner {
  background: #fff;
  border-radius: 14px;
  padding: 10px;
  display: flex;
  gap: 10px;
}

.inner input {
  flex: 1;
  border: none;
  outline: none;
  padding: 14px;
  font-size: 16px;
  border-radius: 10px;
}

.inner button {
  background: #0b3556;
  border: none;
  color: #fff;
  font-size: 16px;
  font-weight: bold;
  padding: 0 22px;
  border-radius: 10px;
  cursor: pointer;
}

.inner button:hover {
  background: #092b45;
}

/* ===== SALJU ===== */
.snow {
  position: fixed;
  inset: 0;
  pointer-events: none;
  background-image:
    radial-gradient(white 2px, transparent 2px),
    radial-gradient(white 1.5px, transparent 1.5px),
    radial-gradient(white 1px, transparent 1px);
  background-size: 120px 120px, 200px 200px, 300px 300px;
  animation: snow 15s linear infinite;
  opacity: 0.6;
}

@keyframes snow {
  from {
    background-position: 0 0, 0 0, 0 0;
  }
  to {
    background-position: 0 600px, 0 800px, 0 1000px;
  }
}

@media (max-width: 480px) {
  .logo {
    font-size: 32px;
  }
}
</style>
</head>

<body>

<div class="snow"></div>

<header>
  <strong>Ilham Smart Learning</strong>
  <div class="right">
    <a href="generate.html">Generate</a>
  </div>
</header>

<div class="center">
  <div class="logo">Ilham Smart Learning</div>
  <div class="sub">Belajar untuk semua</div>

  <div class="card">
    <div class="inner">
      <input
        type="text"
        id="kodeKelas"
        placeholder="Masukkan kode kelas"
        onkeydown="if(event.key === 'Enter') gabungKelas()"
      >
      <button onclick="gabungKelas()">Gabung</button>
    </div>
  </div>
</div>

<script>
function gabungKelas() {
  const kode = document.getElementById("kodeKelas").value.trim();

  if (kode === "") {
    alert("Kode kelas tidak boleh kosong!");
    return;
  }

  // Redirect ke folder kelas/kode
  window.location.href = "kelas/" + encodeURIComponent(kode) + ".html";
}
</script>

</body>
</html>
