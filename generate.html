<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>Generator Kode Kelas</title>
  <style>
    body {
      font-family: Arial, Helvetica, sans-serif;
      background: #f4f6f8;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
    }

    .card {
      background: #fff;
      padding: 24px 30px;
      border-radius: 10px;
      width: 350px;
      text-align: center;
      box-shadow: 0 8px 20px rgba(0,0,0,0.1);
    }

    h2 {
      margin-bottom: 20px;
      color: #333;
    }

    input {
      width: 100%;
      padding: 12px;
      font-size: 16px;
      margin-bottom: 15px;
      text-align: center;
      border: 1px solid #ccc;
      border-radius: 6px;
    }

    button {
      padding: 10px 16px;
      font-size: 14px;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      margin: 5px;
    }

    .generate {
      background: #007bff;
      color: white;
    }

    .copy {
      background: #28a745;
      color: white;
    }

    button:hover {
      opacity: 0.9;
    }

    .note {
      font-size: 12px;
      color: #666;
      margin-top: 10px;
    }
  </style>
</head>
<body>

  <div class="card">
    <h2>Generate Kode Kelas</h2>

    <input type="text" id="result" readonly placeholder="Klik Generate">

    <div>
      <button class="generate" onclick="generateCode()">Generate</button>
      <button class="copy" onclick="copyCode()">Copy</button>
    </div>

    <div class="note">
      Format: 6 karakter + <b>.html</b>
    </div>
  </div>

  <script>
    function generateCode() {
      const chars = "ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789";
      let code = "";

      for (let i = 0; i < 6; i++) {
        const randomIndex = Math.floor(Math.random() * chars.length);
        code += chars[randomIndex];
      }

      document.getElementById("result").value = code + ".html";
    }

    function copyCode() {
      const input = document.getElementById("result");
      if (!input.value) return;

      input.select();
      input.setSelectionRange(0, 99999);
      navigator.clipboard.writeText(input.value);

      alert("Kode kelas berhasil dicopy!");
    }
  </script>

</body>
</html>
